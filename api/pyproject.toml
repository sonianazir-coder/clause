[project]
name = "clause"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sonianazir", email = "sonianazir810@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.3",
    "ipykernel>=7.4.0",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.6",
    "langchain-ollama>=1.1.0",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "ollama>=0.6.3",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.0.1",
    "qdrant-client>=1.20.0",
]

[project.scripts]
clause = "clause:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "playground",
]

[tool.uv]
package = false
